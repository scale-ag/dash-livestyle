name: Build & Deploy Dashboard

# Dispara de 3 formas:
#  - workflow_dispatch : chamado pelo cron-job.org a cada 2 h (via API do GitHub)
#  - schedule          : backup nativo a cada 2 h (o agendador do GitHub costuma
#                        atrasar; o cron-job.org e a fonte principal de pontualidade)
#  - push              : reconstroi quando o codigo muda
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"
  push:
    branches: [ main ]
    paths:
      - "build/**"
      - ".github/workflows/deploy.yml"

# Somente leitura do repo + permissao para publicar no Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Nunca roda dois deploys ao mesmo tempo; nao cancela um deploy em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build e publicacao em jobs separados (padrao oficial do GitHub Pages): o
  # artefato e enviado no job "build" e lido no job "deploy". No mesmo job, o
  # deploy as vezes nao encontrava o artefato recem-enviado ("No artifacts named
  # github-pages were found") e a dash ficava sem atualizar.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build dashboard (le as planilhas via gviz, somente leitura)
        run: python build/build.py --out dist/index.html

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Configure Pages (habilita automaticamente na 1a execucao)
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5

      # Falha intermitente da API de artefatos do GitHub: espera e tenta de novo.
      - name: Aguarda antes de tentar de novo
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (2a tentativa)
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
